name: Optimize images
on:
  push:
    paths: ['images/**', '*.jpg', '*.jpeg', '*.png', '*.JPG', '*.JPEG', '*.PNG']
permissions:
  contents: write
jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resize and compress photos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          find . -maxdepth 2 -type f -not -path './.git/*' \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
            -exec mogrify -auto-orient -resize '1600x1600>' -quality 82 -strip {} +
      - name: Commit optimized images
        run: |
          git config user.name "image-bot"
          git config user.email "image-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Optimize images [skip ci]" && git push)
